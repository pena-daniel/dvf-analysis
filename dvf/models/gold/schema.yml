version: 2

models:
  - name: dim_commune
    columns:
      - name: code_insee
        tests:
          - not_null
          - unique
  

  - name: dim_type_local
    columns:
      - name: type_local_key
        tests:
          - not_null
          - unique

      - name: type_local
        tests:
          - not_null
          - unique
          - accepted_values :
              values:
                - Appartement
                - Maison
                - Dépendance
                - "Local industriel. commercial ou assimilé"
                - "Non renseigné"


      - name: categorie
        tests:
          - not_null
          - accepted_values :
              values:
                - Habitation
                - Autre 
                - "Non renseigné"


  - name: dim_nature_mutation
    columns : 
      - name: nature_mutation_key
        tests:
          - not_null
          - unique
      - name: nature_mutation
        tests:
          - not_null
          - unique


  - name: fct_bien
    columns :
      - name: date_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key

      - name: mutation_key
        tests:
          - not_null
          - relationships:
              to: ref('fct_mutation')
              field: mutation_key

      - name: code_insee
        tests:
          - not_null
          - relationships:
              to: ref('dim_commune')
              field: code_insee 
    
      - name: type_local_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_type_local')
              field: type_local_key

      - name: bien_key
        tests:
          - not_null
          - unique

  - name: fct_mutation
    columns :
      - name: nature_mutation_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_nature_mutation')
              field: nature_mutation_key

      - name: mutation_key
        tests:
          - not_null
          - unique

      - name: code_insee
        tests:
          - not_null
          - relationships:
              to: ref('dim_commune')
              field: code_insee

      - name: date_key
        tests: 
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key

